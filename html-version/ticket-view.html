<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Digital Pass — CampusEvent Hub</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        body { background: #e2e8f0; padding: 40px 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .ticket-wrapper { max-width: 680px; margin: 0 auto; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.15); border: 1px solid #cbd5e1; }
        .ticket-header { background: #0f172a; color: #fff; padding: 24px 30px; border-bottom: 3px solid #1e40af; display: flex; justify-content: space-between; align-items: center; }
        .ticket-body { padding: 30px; }
        .ticket-event-title { font-size: 1.5rem; font-weight: 800; color: #0f172a; line-height: 1.25; margin-bottom: 8px; }
        .ticket-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; margin-top: 24px; padding-top: 20px; border-top: 1px dashed #cbd5e1; }
        .ticket-meta-label { font-size: 0.72rem; text-transform: uppercase; color: #64748b; font-weight: 700; margin-bottom: 2px; }
        .ticket-meta-val { font-size: 0.95rem; font-weight: 700; color: #0f172a; margin-bottom: 14px; }
        .ticket-qr-box { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 8px; padding: 16px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .ticket-code-badge { font-family: monospace; font-size: 1.1rem; font-weight: 800; color: #1e40af; letter-spacing: 0.08em; margin-top: 8px; }
        .ticket-footer { background: #f8fafc; padding: 16px 30px; border-top: 1px solid #e2e8f0; font-size: 0.78rem; color: #64748b; display: flex; justify-content: space-between; align-items: center; }
        .print-toolbar { max-width: 680px; margin: 0 auto 20px auto; display: flex; justify-content: space-between; align-items: center; }
        @media print {
            body { background: #fff; padding: 0; }
            .print-toolbar { display: none !important; }
            .ticket-wrapper { box-shadow: none; border: 1px solid #000; }
        }
    </style>
</head>
<body>

<div class="print-toolbar">
    <a href="student-dashboard.html" class="btn btn-outline-secondary btn-sm">&larr; Back to Dashboard</a>
    <button type="button" class="btn btn-primary btn-sm" onclick="window.print()">
        Print Pass / Save as PDF
    </button>
</div>

<div class="ticket-wrapper" id="ticketWrapper">
    <!-- Dynamically loaded -->
</div>

<script src="assets/js/mock-db.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code') || 'TCK-8841-A1';
    const ref = params.get('ref');

    const bookings = MockDB.getBookings();
    let foundBooking = null;
    let foundAttendee = null;

    for (const b of bookings) {
        const att = b.attendees.find(a => a.ticket_code === code);
        if (att) {
            foundBooking = b;
            foundAttendee = att;
            break;
        }
    }

    if (!foundBooking) {
        foundBooking = bookings[0];
        foundAttendee = foundBooking.attendees[0];
    }

    document.title = `Pass: ${foundAttendee.ticket_code} — CampusEvent Hub`;

    const wrapper = document.getElementById('ticketWrapper');
    wrapper.innerHTML = `
        <div class="ticket-header">
            <div style="display:flex; align-items:center; gap:10px;">
                <div style="width:32px; height:32px; background:#1e40af; border-radius:4px; display:flex; align-items:center; justify-content:center; color:#fff;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16.5 6v.75m0 3v.75m0 3v.75m0 3V18m-9-5.25h5.25M7.5 15h3M3.375 5.25c-.621 0-1.125.504-1.125 1.125v3.026a2.999 2.999 0 010 5.198v3.026c0 .621.504 1.125 1.125 1.125h17.25c.621 0 1.125-.504 1.125-1.125v-3.026a2.999 2.999 0 010-5.198V6.375c0-.621-.504-1.125-1.125-1.125H3.375z"/></svg>
                </div>
                <div>
                    <div style="font-weight:800; font-size:1.05rem;">CampusEvent Hub</div>
                    <div style="font-size:0.68rem; color:#94a3b8; text-transform:uppercase;">Official Academic Entry Pass</div>
                </div>
            </div>
            <div>
                <span class="badge badge-secondary">Academic Pass</span>
            </div>
        </div>

        <div class="ticket-body">
            <h1 class="ticket-event-title">${foundBooking.event_title}</h1>
            <div style="font-size:0.9rem; color:#475569;">
                ${foundBooking.venue}
            </div>

            <div class="ticket-grid">
                <div>
                    <div class="ticket-meta-label">Pass Holder / Attendee</div>
                    <div class="ticket-meta-val" style="font-size:1.15rem; color:#1e40af;">${foundAttendee.attendee_name}</div>

                    <div class="ticket-meta-label">Attendee Email</div>
                    <div class="ticket-meta-val">${foundAttendee.attendee_email}</div>

                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                        <div>
                            <div class="ticket-meta-label">Event Date</div>
                            <div class="ticket-meta-val">${foundBooking.event_date}</div>
                        </div>
                        <div>
                            <div class="ticket-meta-label">Access Time</div>
                            <div class="ticket-meta-val">${foundBooking.event_time || '09:00 AM'}</div>
                        </div>
                    </div>

                    <div class="ticket-meta-label">Booking Reference</div>
                    <div class="ticket-meta-val" style="font-family:monospace;">${foundBooking.booking_reference}</div>
                </div>

                <div class="ticket-qr-box">
                    <svg width="120" height="120" viewBox="0 0 120 120" style="background:#ffffff; border-radius:4px; padding:4px;">
                        <rect x="0" y="0" width="34" height="34" fill="#0f172a" />
                        <rect x="4" y="4" width="26" height="26" fill="#ffffff" />
                        <rect x="9" y="9" width="16" height="16" fill="#0f172a" />

                        <rect x="86" y="0" width="34" height="34" fill="#0f172a" />
                        <rect x="90" y="4" width="26" height="26" fill="#ffffff" />
                        <rect x="95" y="9" width="16" height="16" fill="#0f172a" />

                        <rect x="0" y="86" width="34" height="34" fill="#0f172a" />
                        <rect x="4" y="90" width="26" height="26" fill="#ffffff" />
                        <rect x="9" y="95" width="16" height="16" fill="#0f172a" />

                        <rect x="42" y="10" width="6" height="6" fill="#0f172a" />
                        <rect x="54" y="10" width="6" height="6" fill="#0f172a" />
                        <rect x="42" y="24" width="6" height="6" fill="#0f172a" />
                        <rect x="54" y="36" width="12" height="6" fill="#0f172a" />
                        <rect x="54" y="60" width="18" height="6" fill="#0f172a" />
                        <rect x="80" y="48" width="6" height="12" fill="#0f172a" />
                        <rect x="42" y="74" width="12" height="6" fill="#0f172a" />
                        <rect x="60" y="86" width="6" height="18" fill="#0f172a" />
                        <rect x="86" y="100" width="18" height="6" fill="#0f172a" />
                    </svg>
                    <div class="ticket-code-badge">${foundAttendee.ticket_code}</div>
                    <div style="font-size:0.7rem; color:#64748b; margin-top:2px;">Scan at Entrance Terminal</div>
                </div>
            </div>

            <div style="margin-top:24px; padding-top:16px; border-top:1px solid #e2e8f0; text-align:center;">
                <svg width="100%" height="28" viewBox="0 0 300 28" preserveAspectRatio="none">
                    <rect x="10" width="4" height="28" fill="#334155"/>
                    <rect x="18" width="8" height="28" fill="#334155"/>
                    <rect x="30" width="2" height="28" fill="#334155"/>
                    <rect x="36" width="6" height="28" fill="#334155"/>
                    <rect x="48" width="10" height="28" fill="#334155"/>
                    <rect x="64" width="4" height="28" fill="#334155"/>
                    <rect x="74" width="6" height="28" fill="#334155"/>
                    <rect x="86" width="8" height="28" fill="#334155"/>
                    <rect x="100" width="2" height="28" fill="#334155"/>
                    <rect x="110" width="12" height="28" fill="#334155"/>
                    <rect x="130" width="4" height="28" fill="#334155"/>
                    <rect x="140" width="8" height="28" fill="#334155"/>
                    <rect x="154" width="2" height="28" fill="#334155"/>
                    <rect x="162" width="6" height="28" fill="#334155"/>
                    <rect x="176" width="10" height="28" fill="#334155"/>
                    <rect x="194" width="4" height="28" fill="#334155"/>
                    <rect x="204" width="8" height="28" fill="#334155"/>
                    <rect x="218" width="2" height="28" fill="#334155"/>
                    <rect x="228" width="6" height="28" fill="#334155"/>
                    <rect x="240" width="10" height="28" fill="#334155"/>
                    <rect x="260" width="4" height="28" fill="#334155"/>
                    <rect x="270" width="8" height="28" fill="#334155"/>
                </svg>
                <div style="font-family:monospace; font-size:0.72rem; color:#64748b; letter-spacing:0.1em; margin-top:4px;">
                    AUTH-HASH: 8F92-VERIFIED-PASS
                </div>
            </div>
        </div>

        <div class="ticket-footer">
            <div>Authorized by CampusEvent Hub Registry</div>
            <div style="color:#1e40af; font-weight:700;">Valid / Admissible Pass</div>
        </div>
    `;
});
</script>
</body>
</html>
