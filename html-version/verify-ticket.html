<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Scanner Terminal — CampusEvent Hub</title>
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<header class="site-header">
    <div class="header-inner">
        <a href="index.html" class="brand-link">
            <div class="brand-logo-mark">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16.5 6v.75m0 3v.75m0 3v.75m0 3V18m-9-5.25h5.25M7.5 15h3M3.375 5.25c-.621 0-1.125.504-1.125 1.125v3.026a2.999 2.999 0 010 5.198v3.026c0 .621.504 1.125 1.125 1.125h17.25c.621 0 1.125-.504 1.125-1.125v-3.026a2.999 2.999 0 010-5.198V6.375c0-.621-.504-1.125-1.125-1.125H3.375z"/></svg>
            </div>
            <div class="brand-text">
                <span class="brand-name">CampusEvent Hub</span>
                <span class="brand-badge">Academic & Enterprise</span>
            </div>
        </a>
        <nav class="main-nav">
            <ul class="nav-list">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="events.html" class="nav-link">Events</a></li>
                <li><a href="verify-ticket.html" class="nav-link active">Ticket Verifier</a></li>
            </ul>
        </nav>
    </div>
</header>

<main class="main-content" style="background:#f1f5f9; padding:36px 0 70px 0;">
    <div class="container" style="max-width:700px;">
        
        <div style="text-align:center; margin-bottom:28px;">
            <h1 style="font-size:1.8rem; font-weight:800; margin-bottom:4px;">Entrance Gate Ticket Scanner</h1>
            <p style="color:var(--text-muted); font-size:0.92rem;">Look up pass credentials and confirm live attendee admissions.</p>
        </div>

        <div class="card" style="margin-bottom:24px;">
            <div class="card-body" style="padding:24px;">
                <form id="verifyForm">
                    <div class="form-group" style="margin-bottom:0;">
                        <label class="form-label">Scan QR or Type Pass Code</label>
                        <div style="display:flex; gap:10px;">
                            <input type="text" id="scanInput" class="form-control num-tabular" placeholder="e.g. TCK-8841-A1" value="TCK-8841-A1" style="text-transform:uppercase; font-size:1.1rem; font-weight:700;" required>
                            <button type="submit" class="btn btn-primary" style="padding:0 24px;">Verify</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div id="verifyResult">
            <!-- Populated on search -->
        </div>

    </div>
</main>

<script src="assets/js/mock-db.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    MockDB.renderHeaderNav('verify');
    const form = document.getElementById('verifyForm');
    const input = document.getElementById('scanInput');
    const resultBox = document.getElementById('verifyResult');

    function performCheck(code) {
        const bookings = MockDB.getBookings();
        let matchBooking = null;
        let matchAttendee = null;

        for (const b of bookings) {
            const att = b.attendees.find(a => a.ticket_code.toUpperCase() === code.toUpperCase());
            if (att) {
                matchBooking = b;
                matchAttendee = att;
                break;
            }
        }

        if (!matchAttendee) {
            resultBox.innerHTML = `
                <div class="alert alert-danger">
                    <div class="alert-content">No valid ticket pass found matching code <strong>${code}</strong>.</div>
                </div>
            `;
            return;
        }

        resultBox.innerHTML = `
            <div class="card" style="border-top:5px solid ${matchAttendee.is_checked_in ? '#d97706' : '#059669'};">
                <div class="card-header">
                    <span class="badge ${matchAttendee.is_checked_in ? 'badge-warning' : 'badge-success'}">
                        ${matchAttendee.is_checked_in ? 'ALREADY CHECKED IN' : 'VALID PASS — ADMIT'}
                    </span>
                    <code style="font-weight:700;">${matchAttendee.ticket_code}</code>
                </div>
                <div class="card-body" style="padding:28px;">
                    <div style="font-size:0.75rem; text-transform:uppercase; color:var(--text-muted); font-weight:700;">Attendee</div>
                    <h2 style="font-size:1.4rem; font-weight:800; color:var(--primary-900); margin-bottom:2px;">
                        ${matchAttendee.attendee_name}
                    </h2>
                    <div style="font-size:0.88rem; color:var(--text-secondary); margin-bottom:16px;">${matchAttendee.attendee_email}</div>

                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px; margin-bottom:24px; padding-top:16px; border-top:1px solid var(--border-subtle);">
                        <div>
                            <div style="font-size:0.72rem; text-transform:uppercase; color:var(--text-muted); font-weight:700;">Event</div>
                            <div style="font-weight:700;">${matchBooking.event_title}</div>
                        </div>
                        <div>
                            <div style="font-size:0.72rem; text-transform:uppercase; color:var(--text-muted); font-weight:700;">Venue</div>
                            <div style="font-weight:700;">${matchBooking.venue}</div>
                        </div>
                    </div>

                    ${!matchAttendee.is_checked_in ? `
                        <button type="button" class="btn btn-primary btn-lg btn-block" style="background:#059669; border-color:#059669;" id="checkinBtn">
                            Confirm Entrance Check-In &rarr;
                        </button>
                    ` : `
                        <div style="background:#fffbeb; border:1px solid #fde68a; border-radius:var(--radius-sm); padding:12px; text-align:center; font-size:0.85rem; color:#92400e;">
                            Attendee was admitted on <strong>${matchAttendee.checked_in_at || 'Today'}</strong>
                        </div>
                    `}
                </div>
            </div>
        `;

        const checkinBtn = document.getElementById('checkinBtn');
        if (checkinBtn) {
            checkinBtn.addEventListener('click', () => {
                matchAttendee.is_checked_in = 1;
                matchAttendee.checked_in_at = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                localStorage.setItem('ceh_bookings', JSON.stringify(bookings));
                performCheck(code);
            });
        }
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        performCheck(input.value.trim());
    });

    performCheck('TCK-8841-A1');
});
</script>
</body>
</html>
