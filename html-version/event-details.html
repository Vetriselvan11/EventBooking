<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Overview — CampusEvent Hub</title>
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<header class="site-header">
    <div class="header-inner">
        <a href="index.html" class="brand-link">
            <div class="brand-logo-mark">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16.5 6v.75m0 3v.75m0 3v.75m0 3V18m-9-5.25h5.25M7.5 15h3M3.375 5.25c-.621 0-1.125.504-1.125 1.125v3.026a2.999 2.999 0 010 5.198v3.026c0 .621.504 1.125 1.125 1.125h17.25c.621 0 1.125-.504 1.125-1.125v-3.026a2.999 2.999 0 010-5.198V6.375c0-.621-.504-1.125-1.125-1.125H3.375z"/></svg>
            </div>
            <div class="brand-text">
                <span class="brand-name">CampusEvent Hub</span>
                <span class="brand-badge">Academic & Enterprise</span>
            </div>
        </a>

        <nav class="main-nav">
            <ul class="nav-list">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="events.html" class="nav-link">Discover Events</a></li>
                <li><a href="student-dashboard.html" class="nav-link nav-link-portal">My Passes</a></li>
            </ul>
        </nav>

        <div class="header-actions">
            <a href="login.html" class="btn btn-outline-primary btn-sm">Sign In</a>
            <a href="register.html" class="btn btn-primary btn-sm">Register</a>
        </div>
    </div>
</header>

<main class="main-content">
    <div class="container" id="eventDetailsContainer">
        <!-- Dynamically rendered via JS -->
    </div>
</main>

<footer class="site-footer">
    <div class="footer-container">
        <div class="footer-bottom">
            <div>&copy; 2026 CampusEvent Hub. Production-grade Event Booking Management System.</div>
        </div>
    </div>
</footer>

<script src="assets/js/mock-db.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    MockDB.renderHeaderNav('events');
    const params = new URLSearchParams(window.location.search);
    const eventId = parseInt(params.get('id') || '1', 10);
    const event = MockDB.getEventById(eventId) || MockDB.getEvents()[0];

    const booked = event.max_capacity - event.available_seats;
    const capacityPct = Math.round((booked / event.max_capacity) * 100);
    const priceText = event.ticket_price === 0 ? 'Free' : '$' + event.ticket_price.toFixed(2);

    document.title = `${event.title} — CampusEvent Hub`;

    const container = document.getElementById('eventDetailsContainer');
    container.innerHTML = `
        <div style="margin-bottom:20px; font-size:0.85rem; color:var(--text-muted);">
            <a href="index.html">Home</a> &gt; 
            <a href="events.html">Events</a> &gt; 
            <span style="color:var(--text-primary); font-weight:600;">${event.title}</span>
        </div>

        <div style="display:grid; grid-template-columns: 1.8fr 1fr; gap:36px; align-items:start;">
            
            <div>
                <div class="card" style="margin-bottom:28px;">
                    <div style="height:260px; background:#1e293b; position:relative; overflow:hidden;">
                        <svg width="100%" height="100%" viewBox="0 0 800 260" preserveAspectRatio="none">
                            <rect width="800" height="260" fill="#1e293b" />
                            <circle cx="400" cy="130" r="80" fill="rgba(30, 64, 175, 0.25)" />
                            <text x="50%" y="54%" text-anchor="middle" fill="#93c5fd" font-size="18" font-weight="700" font-family="sans-serif">${event.category_name}</text>
                        </svg>
                        <div style="position:absolute; top:16px; left:16px; display:flex; gap:8px;">
                            <span class="badge badge-secondary">${event.category_name}</span>
                            <span class="badge badge-success">Open for Booking</span>
                        </div>
                    </div>
                    <div class="card-body" style="padding:28px;">
                        <h1 style="font-size:2rem; font-weight:800; line-height:1.2; margin-bottom:12px;">${event.title}</h1>
                        <p style="font-size:1.05rem; color:var(--text-secondary); line-height:1.6; margin-bottom:0;">${event.short_description}</p>
                    </div>
                </div>

                <div class="card" style="margin-bottom:28px;">
                    <div class="card-header">
                        <h3 class="card-title">Comprehensive Event Overview & Agenda</h3>
                    </div>
                    <div class="card-body" style="padding:28px;">
                        <div style="font-size:0.95rem; color:var(--text-secondary); line-height:1.7; white-space:pre-line;">${event.description}</div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Faculty Event Coordinator</h3>
                    </div>
                    <div class="card-body" style="display:flex; align-items:center; gap:18px;">
                        <div class="user-avatar-badge" style="width:48px; height:48px; font-size:1.2rem;">
                            ${event.coordinator_name.charAt(0)}
                        </div>
                        <div>
                            <h4 style="font-size:1.05rem; margin-bottom:2px;">${event.coordinator_name}</h4>
                            <div style="font-size:0.85rem; color:var(--text-muted); margin-bottom:4px;">
                                ${event.coordinator_desig} · ${event.coordinator_dept}
                            </div>
                            <div style="font-size:0.85rem; color:var(--primary);">
                                Contact: <a href="mailto:${event.coordinator_email}">${event.coordinator_email}</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div style="position:sticky; top:90px;">
                <div class="card" style="border-top:4px solid var(--primary);">
                    <div class="card-body" style="padding:24px;">
                        
                        <div style="display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--border-subtle);">
                            <span style="font-size:0.88rem; color:var(--text-muted); font-weight:600; text-transform:uppercase;">Entry Fee</span>
                            <span style="font-size:1.8rem; font-weight:800; color:var(--primary-900);">${priceText}</span>
                        </div>

                        <div style="display:flex; flex-direction:column; gap:14px; margin-bottom:24px;">
                            <div>
                                <div style="font-size:0.75rem; text-transform:uppercase; color:var(--text-muted); font-weight:700;">Date & Schedule</div>
                                <div style="font-weight:600; color:var(--text-primary);">${event.event_date}</div>
                                <div style="font-size:0.82rem; color:var(--text-secondary);">${event.start_time} – ${event.end_time}</div>
                            </div>
                            <div>
                                <div style="font-size:0.75rem; text-transform:uppercase; color:var(--text-muted); font-weight:700;">Venue & Location</div>
                                <div style="font-weight:600; color:var(--text-primary);">${event.venue}</div>
                                <div style="font-size:0.82rem; color:var(--text-secondary);">${event.venue_address}</div>
                            </div>
                            <div>
                                <div style="font-size:0.75rem; text-transform:uppercase; color:var(--text-muted); font-weight:700;">Registration Cutoff</div>
                                <div style="font-weight:600; color:var(--text-primary);">${event.registration_deadline}</div>
                            </div>
                        </div>

                        <div style="background:#f8fafc; border:1px solid var(--border-subtle); border-radius:var(--radius-sm); padding:14px; margin-bottom:24px;">
                            <div class="capacity-labels" style="margin-bottom:6px;">
                                <span style="font-weight:600; color:var(--text-primary);">Seat Availability</span>
                                <span><strong>${event.available_seats}</strong> remaining (${capacityPct}% filled)</span>
                            </div>
                            <div class="capacity-progress">
                                <div class="capacity-fill" style="width:${capacityPct}%;"></div>
                            </div>
                        </div>

                        <a href="booking.html?event_id=${event.id}" class="btn btn-primary btn-lg btn-block">
                            Proceed to Registration &rarr;
                        </a>
                        <div style="text-align:center; font-size:0.78rem; color:var(--text-muted); margin-top:10px;">
                            Instant cryptographic digital pass issuance
                        </div>

                    </div>
                </div>
            </div>

        </div>
    `;
});
</script>
</body>
</html>
