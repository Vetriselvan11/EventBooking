<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — CampusEvent Hub</title>
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body style="background:#f1f5f9; min-height:100vh; display:flex; flex-direction:column;">

<header class="site-header">
    <div class="header-inner">
        <a href="index.html" class="brand-link">
            <div class="brand-logo-mark">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16.5 6v.75m0 3v.75m0 3v.75m0 3V18m-9-5.25h5.25M7.5 15h3M3.375 5.25c-.621 0-1.125.504-1.125 1.125v3.026a2.999 2.999 0 010 5.198v3.026c0 .621.504 1.125 1.125 1.125h17.25c.621 0 1.125-.504 1.125-1.125v-3.026a2.999 2.999 0 010-5.198V6.375c0-.621-.504-1.125-1.125-1.125H3.375z"/></svg>
            </div>
            <div class="brand-text">
                <span class="brand-name">CampusEvent Hub</span>
                <span class="brand-badge">Academic & Enterprise</span>
            </div>
        </a>
    </div>
</header>

<main class="main-content" style="display:flex; align-items:center; justify-content:center;">
    <div style="width:100%; max-width:440px; padding:20px;">
        
        <div class="card" style="box-shadow:var(--shadow-md); border-top:4px solid var(--primary);">
            <div class="card-header" style="text-align:center; display:block; padding:24px 24px 14px 24px;">
                <div class="brand-logo-mark" style="margin:0 auto 12px auto;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>
                </div>
                <h2 style="font-size:1.35rem; font-weight:800; margin-bottom:4px;">Sign In to CampusEvent</h2>
                <p style="font-size:0.85rem; color:var(--text-muted); margin:0;">Access your student passes, coordinator desk, or console</p>
            </div>

            <div class="card-body" style="padding:24px;">
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label form-label-required">Institutional Email</label>
                        <input type="email" id="loginEmail" class="form-control" placeholder="username@campus.edu" required autofocus>
                    </div>

                    <div class="form-group">
                        <label class="form-label form-label-required">Password</label>
                        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" style="padding:11px; margin-top:8px;">
                        Sign In &rarr;
                    </button>
                </form>
            </div>

            <div class="card-footer" style="text-align:center; font-size:0.86rem;">
                Need an account? <a href="register.html" style="font-weight:600;">Student Register</a>
            </div>
        </div>

    </div>
</main>

<script src="assets/js/mock-db.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPassword').value;

    if (!email || !pass) {
        alert('Please enter both email and password.');
        return;
    }

    if (email.toLowerCase().includes('admin')) {
        MockDB.setCurrentUser({ id: 1, name: 'Dr. Arthur Pendelton', email: email, role: 'admin' });
        window.location.href = 'admin-dashboard.html';
    } else if (email.toLowerCase().includes('coord') || email.toLowerCase().includes('marcus') || email.toLowerCase().includes('elena') || email.toLowerCase().includes('miller')) {
        const coords = MockDB.getCoordinators();
        const found = coords.find(c => c.email.toLowerCase() === email.toLowerCase()) || coords[0];
        if (found && found.status === 'suspended') {
            alert('Access Denied: Your Faculty Coordinator account has been suspended by the System Administrator.');
            return;
        }
        MockDB.setCurrentUser({
            id: found ? found.id : 2,
            name: found ? found.name : 'Prof. Elena Rostova',
            email: email,
            role: 'coordinator',
            department: found ? found.department : 'Computer Science & Engineering'
        });
        window.location.href = 'coordinator-dashboard.html';
    } else {
        MockDB.setCurrentUser({
            id: 4,
            name: 'Alexander Wright',
            email: email,
            role: 'student',
            student_id: 'STU-2024-8841',
            department: 'Computer Science & Engineering'
        });
        window.location.href = 'student-dashboard.html';
    }
});
</script>
</body>
</html>
